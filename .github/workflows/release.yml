name: Release macOS DMG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and package Apple silicon
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false

      - name: Validate release version and toolchain
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" == v* ]]
          version="${RELEASE_TAG#v}"
          source scripts/release-version.sh
          validate_release_version "$version" "$GITHUB_RUN_NUMBER"
          [[ "$(uname -m)" == arm64 ]]
          xcodebuild -version
          swift --version
          prerelease=false
          if [[ "$version" == *-* ]]; then prerelease=true; fi
          {
            echo "tag=$RELEASE_TAG"
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "commit=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Cache pinned dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/artifacts
            .build/checkouts
            .build/repositories
            .build/tools/chromaprint
          key: macarok-${{ runner.os }}-${{ runner.arch }}-xcode27.1-${{ hashFiles('Package.resolved', 'Package.swift', 'scripts/fetch-fingerprint-helper.sh') }}
          restore-keys: |
            macarok-${{ runner.os }}-${{ runner.arch }}-xcode27.1-

      - name: Generate synthetic library fixtures
        run: python3 scripts/create-demo-library.py .build/demo-library --no-codecs

      - name: Test with the pinned fingerprint helper
        run: |
          set -euo pipefail
          helper_path="$(./scripts/fetch-fingerprint-helper.sh)"
          MACAROK_FPCALC_PATH="$helper_path" \
          MACAROK_SNAPSHOT_DIRECTORY="$RUNNER_TEMP/native-snapshots" \
            swift test

      - name: Import the optional signing certificate
        env:
          SIGNING_P12_BASE64: ${{ secrets.MACAROK_SIGNING_P12_BASE64 }}
          SIGNING_P12_PASSWORD: ${{ secrets.MACAROK_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$SIGNING_P12_BASE64" ]]; then
            echo "No signing certificate is configured; the app is ad-hoc signed."
            exit 0
          fi
          keychain="$RUNNER_TEMP/macarok-signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          certificate="$RUNNER_TEMP/macarok-signing.p12"
          printf '%s' "$SIGNING_P12_BASE64" | base64 --decode > "$certificate"
          security import "$certificate" -k "$keychain" -f pkcs12 -P "$SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$certificate"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          identity="$(security find-identity -p codesigning "$keychain" | awk '/[0-9A-F]{40}/ { print $2; exit }')"
          [[ -n "$identity" ]]
          {
            echo "MACAROK_SIGNING_IDENTITY=$identity"
            echo "MACAROK_SIGNING_KEYCHAIN=$keychain"
          } >> "$GITHUB_ENV"

      - name: Build and verify the disk image
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: ./scripts/package-dmg.sh "$RELEASE_VERSION" "$GITHUB_RUN_NUMBER"

      - name: Remove the signing keychain
        if: always()
        run: |
          if [[ -n "${MACAROK_SIGNING_KEYCHAIN:-}" ]]; then security delete-keychain "$MACAROK_SIGNING_KEYCHAIN" || true; fi

      - name: Retain verified release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macarok-${{ steps.release.outputs.version }}-arm64
          path: |
            dist/Macarok-${{ steps.release.outputs.version }}-arm64.dmg
            dist/Macarok-${{ steps.release.outputs.version }}-arm64.dmg.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
      RELEASE_PRERELEASE: ${{ needs.build.outputs.prerelease }}
      RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
    steps:
      - name: Check out release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false

      - name: Download verified release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macarok-${{ needs.build.outputs.version }}-arm64
          path: dist

      - name: Verify download checksum
        working-directory: dist
        run: sha256sum --check "Macarok-$RELEASE_VERSION-arm64.dmg.sha256"

      - name: Create draft with assets and publish
        run: |
          set -euo pipefail
          remote_commit="$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)"
          if [[ "$remote_commit" != "$RELEASE_COMMIT" ]]; then
            echo '::error::The release tag moved after the build started.'
            exit 1
          fi
          notes="docs/releases/$RELEASE_VERSION.md"
          notes_arguments=(--generate-notes --notes 'Apple silicon (arm64), macOS 14 or later. Locally signed with an ad hoc signature; not notarized by Apple. See the README for installation details.')
          edit_notes_arguments=()
          if [[ -f "$notes" ]]; then
            notes_arguments=(--notes-file "$notes")
            edit_notes_arguments=(--notes-file "$notes")
          fi
          if gh release view "$RELEASE_TAG" --json isDraft,tagName > "$RUNNER_TEMP/existing-release.json" 2>/dev/null; then
            if ! jq --exit-status --arg tag "$RELEASE_TAG" \
              '(.isDraft == true) and (.tagName == $tag)' \
              "$RUNNER_TEMP/existing-release.json" >/dev/null; then
              echo '::error::The existing release is published or uses a different tag; refusing to overwrite it.'
              exit 1
            fi
            gh release upload "$RELEASE_TAG" \
              "dist/Macarok-$RELEASE_VERSION-arm64.dmg" \
              "dist/Macarok-$RELEASE_VERSION-arm64.dmg.sha256" --clobber
          else
            gh release create "$RELEASE_TAG" \
              "dist/Macarok-$RELEASE_VERSION-arm64.dmg" \
              "dist/Macarok-$RELEASE_VERSION-arm64.dmg.sha256" \
              --verify-tag --draft \
              --title "Macarok $RELEASE_VERSION" \
              --prerelease="$RELEASE_PRERELEASE" "${notes_arguments[@]}"
          fi
          gh release edit "$RELEASE_TAG" --draft=false \
            --title "Macarok $RELEASE_VERSION" --prerelease="$RELEASE_PRERELEASE" \
            "${edit_notes_arguments[@]}" \
            --latest="$([[ "$RELEASE_PRERELEASE" == false ]] && echo true || echo false)"
