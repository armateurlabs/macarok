&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();

  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();

    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },

   * @param {string} property

  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);

  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

  const postToHost = (type, payload) =&gt; {

  };

    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }

    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);

    );

      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }

      modelContent: null,
      privateContent: null,
      ...parsedState,
    };

    if (encode(serializedState).length &gt; 16 * 1024) {

      );

      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;

    }

        new TypeError(&quot;Visualization state does not support image attachments&quot;),

        reject(persistenceError());

      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });

  const bindingElement = document.getElementById(&quot;codex-visualization-bindings&quot;);
  const mockElement = document.getElementById(&quot;codex-connector-mocks&quot;);
  const fileElement = document.getElementById(&quot;codex-preview-files&quot;);
  const connectorGlobals = {};
  if (bindingElement != null || mockElement != null || fileElement != null) {
    const bindings = parse(bindingElement?.textContent ?? &quot;{}&quot;);
    bindingElement?.remove();

      for (const child of Object.values(object)) {

    const updates = [];
    if (mockElement != null) {
      const mocks = Object.entries(parse(mockElement.textContent));
      mockElement.remove();
      for (const [name, value] of mocks) {
        values.set(name, value);
        updates.push({ name, revision: 1, state: &quot;ready&quot;, value: { type: &quot;json&quot;, value } });
      }
    }
    if (fileElement != null) {
      const files = parse(fileElement.textContent);
      fileElement.remove();
      const blobs = new Map();
      const urls = [];
      for (const [name, binding] of Object.entries(bindings)) {
        if (binding.type !== &quot;file&quot; || !hasOwn(files, binding.path)) continue;
        const file = files[binding.path];
        let blob = blobs.get(binding.path);
        if (blob == null) {
          const bytes = Uint8Array.fromBase64?.(file.base64) ??
            Uint8Array.from(atob(file.base64), (char) =&gt; char.charCodeAt(0));

    connectorGlobals.visualization = {
      get bindings() {
        return bindings;
      },
      /** @param {string} name @param {(value: unknown) =&gt; void} callback */
      onData(name, callback) {
        if (typeof callback !== &quot;function&quot;) {
          throw new TypeError(&quot;onData requires a callback&quot;);

        return () =&gt; {};
      },

  }
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      ...connectorGlobals,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);

                }

            }

        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }

    },
    { capture: true },
  );

  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {

    }

    if (event.target instanceof globalThis.Element) {
      element = event.target;

      element = event.target.parentElement;

        id = decodeURIComponent(href.slice(1));

      });
      return;
    }

  });

})();

      q(&#x27;.view-switch&#x27;).innerHTML=viewLabels.map(label=&gt;`&lt;button data-action=&quot;view&quot; data-value=&quot;${label.toLowerCase()}&quot; ${state.view===label.toLowerCase()?&#x27;aria-current=&quot;page&quot;&#x27;:&#x27;&#x27;}&gt;${label}&lt;/button&gt;`).join(&#x27;&#x27;);
      q(&#x27;.library-heading&#x27;).textContent=state.query?&#x27;Search results&#x27;:state.view===&#x27;home&#x27;?(layout===&#x27;album&#x27;?&#x27;Browse albums&#x27;:&#x27;Your library&#x27;):state.view;
      const scopeButton=q(&#x27;.library-caption button&#x27;);
      scopeButton.dataset.action=state.view===&#x27;folders&#x27;?&#x27;shuffle-folder&#x27;:&#x27;shuffle-library&#x27;;
      scopeButton.setAttribute(&#x27;aria-label&#x27;,state.view===&#x27;folders&#x27;?&#x27;Shuffle selected folder&#x27;:&#x27;Shuffle this library&#x27;);
      scopeButton.dataset.tooltip=state.view===&#x27;folders&#x27;?&#x27;Shuffle selected folder&#x27;:&#x27;Shuffle this library&#x27;;
      let rows=&#x27;&#x27;;
      if(state.query) {
        const term=state.query.toLocaleLowerCase();
        items.forEach(album=&gt;album.tracks.forEach((track,index)=&gt;{if(`${track[0]} ${album.title} ${album.artist}`.toLocaleLowerCase().includes(term)) rows+=listRow(track[0],&#x27;select-track&#x27;,`${album.id}:${index}`,{symbol:&#x27;music-2&#x27;,selected:state.selected===album.id&amp;&amp;state.selectedTrack===index});}));
        if(!rows) rows=&#x27;&lt;p class=&quot;dim small&quot; style=&quot;padding:8px&quot;&gt;No tracks found in this source.&lt;/p&gt;&#x27;;
      } else if(state.view===&#x27;home&#x27;&amp;&amp;layout===&#x27;album&#x27;) {
        rows=items.map(album=&gt;listRow(album.title,&#x27;album&#x27;,album.id,{album,selected:album.id===state.selected})).join(&#x27;&#x27;);
      } else if(state.view===&#x27;artists&#x27;||state.view===&#x27;home&#x27;) {
        const artists=[...new Set(items.map(album=&gt;album.artist))].sort();
        artists.forEach(artist=&gt;{
          const artistAlbums=items.filter(album=&gt;album.artist===artist),expanded=selected.artist===artist;
          rows+=listRow(artist,&#x27;artist&#x27;,artist,{symbol:expanded?&#x27;chevron-down&#x27;:&#x27;chevron-right&#x27;,selected:expanded,count:artistAlbums.length});
          if(expanded) artistAlbums.forEach(album=&gt;{
            rows+=listRow(album.title,&#x27;album&#x27;,album.id,{depth:&#x27;child&#x27;,symbol:&#x27;disc-3&#x27;,selected:false,count:album.cue?&#x27;CUE&#x27;:album.year});
            if(layout===&#x27;collection&#x27;&amp;&amp;album.id===state.selected) album.tracks.slice(0,5).forEach((track,index)=&gt;{rows+=listRow(track[0],&#x27;select-track&#x27;,`${album.id}:${index}`,{depth:&#x27;deep&#x27;,symbol:&#x27;music-2&#x27;,selected:state.selectedTrack===index&amp;&amp;state.context===&#x27;track&#x27;});});
          });
        });
      } else if(state.view===&#x27;albums&#x27;) {
        rows=items.map(album=&gt;listRow(album.title,&#x27;album&#x27;,album.id,{album,selected:album.id===state.selected})).join(&#x27;&#x27;);
      } else if(state.view===&#x27;years&#x27;) {
        [...new Set(items.map(album=&gt;album.year))].sort((a,b)=&gt;b-a).forEach(year=&gt;{
          rows+=listRow(String(year),&#x27;year&#x27;,year,{symbol:year===selected.year?&#x27;chevron-down&#x27;:&#x27;chevron-right&#x27;,selected:year===selected.year,count:items.filter(album=&gt;album.year===year).length});
          if(year===selected.year) items.filter(album=&gt;album.year===year).forEach(album=&gt;{rows+=listRow(album.title,&#x27;album&#x27;,album.id,{depth:&#x27;child&#x27;,symbol:&#x27;disc-3&#x27;});});
        });
      } else if(state.view===&#x27;folders&#x27;) {
        rows+=listRow(state.source===&#x27;local&#x27;?&#x27;Music&#x27;:state.source===&#x27;subsonic&#x27;?&#x27;Music library&#x27;:&#x27;Downloaded episodes&#x27;,&#x27;folder&#x27;,&#x27;root&#x27;,{symbol:&#x27;folder-open&#x27;,count:items.length});
        const groups=state.source===&#x27;local&#x27;?[&#x27;Electronic&#x27;,&#x27;Alternative&#x27;,&#x27;Progressive Rock&#x27;,&#x27;Modern Classical&#x27;,&#x27;Trip Hop&#x27;]:[...new Set(items.map(album=&gt;album.genre))];
        groups.forEach(genre=&gt;{
          const matching=items.filter(album=&gt;album.genre===genre);
          rows+=listRow(genre,&#x27;folder&#x27;,genre,{depth:&#x27;child&#x27;,symbol:genre===state.folder?&#x27;folder-open&#x27;:&#x27;folder&#x27;,selected:genre===state.folder,count:matching.length});
          if(genre===state.folder) matching.forEach(album=&gt;{rows+=listRow(album.title,&#x27;album&#x27;,album.id,{depth:&#x27;deep&#x27;,symbol:&#x27;disc-3&#x27;,count:album.cue?&#x27;CUE&#x27;:&#x27;&#x27;});});
        });
      } else if(state.view===&#x27;tags&#x27;) {
        rows+=listRow(&#x27;Genre&#x27;,&#x27;tag-group&#x27;,&#x27;genre&#x27;,{symbol:&#x27;chevron-down&#x27;});
        [...new Set(items.map(album=&gt;album.genre))].forEach(genre=&gt;{rows+=listRow(genre,&#x27;genre&#x27;,genre,{depth:&#x27;child&#x27;,symbol:&#x27;tag&#x27;,selected:selected.genre===genre,count:items.filter(album=&gt;album.genre===genre).length});});
        rows+=listRow(&#x27;File format&#x27;,&#x27;tag-group&#x27;,&#x27;format&#x27;,{symbol:&#x27;chevron-down&#x27;});
        [...new Set(items.map(album=&gt;album.format))].forEach(format=&gt;{rows+=listRow(format===&#x27;OGG&#x27;?&#x27;Ogg Vorbis&#x27;:format===&#x27;OPUS&#x27;?&#x27;Ogg Opus&#x27;:format,&#x27;format&#x27;,format,{depth:&#x27;child&#x27;,symbol:&#x27;file-audio&#x27;,count:items.filter(album=&gt;album.format===format).length});});
      }

    }
    function tile(album) {return `&lt;button class=&quot;album-tile&quot; data-action=&quot;album&quot; data-value=&quot;${album.id}&quot;&gt;${cover(album,true)}&lt;strong class=&quot;ellipsis&quot; data-tooltip=&quot;${escapeHTML(album.title)}&quot;&gt;${escapeHTML(album.title)}&lt;/strong&gt;&lt;span class=&quot;dim ellipsis&quot;&gt;${escapeHTML(album.artist)}&lt;/span&gt;&lt;/button&gt;`;}
    function home() {

      return `&lt;div class=&quot;home-heading&quot;&gt;&lt;div class=&quot;context-kicker&quot;&gt;${escapeHTML(sourceNames[state.source])}&lt;/div&gt;&lt;h1&gt;Good evening.&lt;/h1&gt;&lt;p&gt;A little closer to your music.&lt;/p&gt;&lt;/div&gt;&lt;section class=&quot;home-section&quot;&gt;&lt;div class=&quot;section-heading&quot;&gt;&lt;h3&gt;Recently Added&lt;/h3&gt;&lt;span class=&quot;small dim&quot;&gt;This week&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;related-albums&quot;&gt;${recent.map(tile).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;home-section&quot;&gt;&lt;div class=&quot;section-heading&quot;&gt;&lt;h3&gt;Recently Played&lt;/h3&gt;&lt;/div&gt;${items.slice(0,2).map((album,index)=&gt;`&lt;button class=&quot;recent-track&quot; data-action=&quot;select-track&quot; data-value=&quot;${album.id}:${Math.min(1,album.tracks.length-1)}&quot;&gt;${cover(album)}&lt;span&gt;&lt;strong class=&quot;ellipsis&quot;&gt;${escapeHTML(album.tracks[Math.min(1,album.tracks.length-1)][0])}&lt;/strong&gt;&lt;span class=&quot;dim ellipsis&quot;&gt;${escapeHTML(album.artist)} · ${escapeHTML(album.title)}&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;recent-time&quot;&gt;${index?&#x27;Yesterday&#x27;:&#x27;1 hour ago&#x27;}&lt;/span&gt;&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/section&gt;&lt;section class=&quot;home-section&quot;&gt;&lt;div class=&quot;section-heading&quot;&gt;&lt;h3&gt;Most Played&lt;/h3&gt;&lt;select data-field=&quot;top&quot; aria-label=&quot;Most played category&quot;&gt;${[&#x27;Albums&#x27;,&#x27;Tracks&#x27;,&#x27;Artists&#x27;].map(value=&gt;`&lt;option ${state.top===value?&#x27;selected&#x27;:&#x27;&#x27;}&gt;${value}&lt;/option&gt;`).join(&#x27;&#x27;)}&lt;/select&gt;&lt;/div&gt;${topItems.map((album,index)=&gt;`&lt;button class=&quot;recent-track&quot; data-action=&quot;${state.top===&#x27;Artists&#x27;?&#x27;artist&#x27;:state.top===&#x27;Tracks&#x27;?&#x27;select-track&#x27;:&#x27;album&#x27;}&quot; data-value=&quot;${state.top===&#x27;Artists&#x27;?escapeHTML(album.artist):state.top===&#x27;Tracks&#x27;?`${album.id}:0`:album.id}&quot;&gt;&lt;span class=&quot;dim small&quot; style=&quot;flex:0 0 13px&quot;&gt;${index+1}&lt;/span&gt;${cover(album)}&lt;span&gt;&lt;strong class=&quot;ellipsis&quot;&gt;${escapeHTML(state.top===&#x27;Artists&#x27;?album.artist:state.top===&#x27;Tracks&#x27;?album.tracks[0][0]:album.title)}&lt;/strong&gt;&lt;span class=&quot;dim ellipsis&quot;&gt;${escapeHTML(state.top===&#x27;Artists&#x27;?`${items.filter(a=&gt;a.artist===album.artist).length} albums`:album.artist)}&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;recent-time&quot;&gt;${[48,32,26][index]} plays&lt;/span&gt;&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/section&gt;`;
    }
    function albumView(album) {
      return `&lt;div class=&quot;context-kicker&quot;&gt;${state.source===&#x27;podcasts&#x27;?&#x27;Podcast&#x27;:&#x27;Album&#x27;} · ${album.year}&lt;/div&gt;&lt;div class=&quot;album-hero&quot;&gt;${cover(album,true)}&lt;div&gt;&lt;h1&gt;${escapeHTML(album.title)}&lt;/h1&gt;&lt;p&gt;${escapeHTML(album.artist)}&lt;/p&gt;&lt;p&gt;${album.tracks.length} ${state.source===&#x27;podcasts&#x27;?&#x27;episodes&#x27;:&#x27;tracks&#x27;} · ${clock(album.tracks.reduce((sum,t)=&gt;sum+seconds(t[1]),0))}&lt;/p&gt;&lt;span class=&quot;file-badge&quot;&gt;${album.cue?&#x27;CUE + FLAC&#x27;:album.format===&#x27;OGG&#x27;?&#x27;OGG VORBIS&#x27;:album.format===&#x27;OPUS&#x27;?&#x27;OGG OPUS&#x27;:album.format}&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;action-row&quot;&gt;&lt;button class=&quot;am-button primary&quot; data-action=&quot;add-album&quot;&gt;${icon(&#x27;list-plus&#x27;)} Add to Playlist&lt;/button&gt;&lt;button class=&quot;am-button&quot; data-action=&quot;shuffle-album&quot;&gt;${icon(&#x27;shuffle&#x27;)} Shuffle&lt;/button&gt;&lt;button class=&quot;icon-button&quot; data-action=&quot;metadata&quot; aria-label=&quot;Edit album metadata&quot;&gt;${icon(&#x27;square-pen&#x27;)}&lt;/button&gt;&lt;/div&gt;&lt;div&gt;${album.tracks.map((track,index)=&gt;`&lt;button class=&quot;album-track ${state.selectedTrack===index?&#x27;current&#x27;:&#x27;&#x27;}&quot; data-action=&quot;select-track&quot; data-value=&quot;${album.id}:${index}&quot;&gt;&lt;span class=&quot;number&quot;&gt;${String(index+1).padStart(2,&#x27;0&#x27;)}&lt;/span&gt;&lt;span class=&quot;ellipsis&quot;&gt;${escapeHTML(track[0])}&lt;/span&gt;&lt;span class=&quot;time&quot;&gt;${track[1]}&lt;/span&gt;&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;${album.cue?`&lt;div class=&quot;cue-info&quot;&gt;${icon(&#x27;file-audio&#x27;)}&lt;span&gt;10 tracks · one FLAC file&lt;br&gt;Track boundaries from &lt;strong&gt;album.cue&lt;/strong&gt;&lt;/span&gt;&lt;/div&gt;`:&#x27;&#x27;}&lt;div class=&quot;context-footer&quot;&gt;&lt;span&gt;${icon(&#x27;mouse-pointer-2&#x27;)} Double-click to add to playlist&lt;/span&gt;&lt;button class=&quot;icon-button&quot; data-action=&quot;artwork&quot; aria-label=&quot;Choose album artwork&quot;&gt;${icon(&#x27;image&#x27;)}&lt;/button&gt;&lt;/div&gt;`;

    function trackView(album) {

        const others=ownAlbums().filter(other=&gt;other.id!==album.id).slice(0,3);
        detail=`&lt;div class=&quot;fact-grid&quot;&gt;&lt;div&gt;&lt;span&gt;Played&lt;/span&gt;&lt;strong&gt;${index===3?24:12} times&lt;/strong&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;Last played&lt;/span&gt;&lt;strong&gt;Yesterday&lt;/strong&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;Rating&lt;/span&gt;&lt;strong aria-label=&quot;Four out of five stars&quot;&gt;★★★★&lt;span style=&quot;display:inline;color:var(--am-dim)&quot;&gt;☆&lt;/span&gt;&lt;/strong&gt;&lt;/div&gt;&lt;/div&gt;&lt;section class=&quot;context-section&quot;&gt;&lt;h3&gt;About ${escapeHTML(album.artist)}&lt;/h3&gt;&lt;p class=&quot;context-body-copy&quot;&gt;${escapeHTML(biographies[album.artist]||`${album.title} is part of your ${sourceNames[state.source]} collection. Explore the album, edit its metadata, or add more tracks to your playlist.`)}&lt;/p&gt;&lt;button class=&quot;context-action&quot; data-action=&quot;artist&quot; data-value=&quot;${escapeHTML(album.artist)}&quot;&gt;View artist ${icon(&#x27;arrow-up-right&#x27;)}&lt;/button&gt;&lt;/section&gt;&lt;section class=&quot;context-section&quot;&gt;&lt;h3&gt;In your collection&lt;/h3&gt;&lt;div class=&quot;related-albums&quot;&gt;${others.map(tile).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/section&gt;`;
      } else if(state.tab===&#x27;lyrics&#x27;) {
        detail=`&lt;div class=&quot;empty-lyrics&quot;&gt;${icon(&#x27;text-quote&#x27;)}&lt;strong&gt;${album.artist===&#x27;Boards of Canada&#x27;||album.artist===&#x27;Nils Frahm&#x27;?&#x27;Instrumental track&#x27;:&#x27;No lyrics attached&#x27;}&lt;/strong&gt;&lt;p&gt;${album.artist===&#x27;Boards of Canada&#x27;||album.artist===&#x27;Nils Frahm&#x27;?&#x27;No lyrics for this recording.&#x27;:&#x27;Lyrics have not been added to this file.&#x27;}&lt;/p&gt;&lt;button class=&quot;am-button&quot; data-action=&quot;find-lyrics&quot;&gt;${icon(&#x27;search&#x27;)} Find Lyrics&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;context-section&quot;&gt;&lt;h3&gt;Track details&lt;/h3&gt;&lt;p class=&quot;context-body-copy&quot;&gt;${escapeHTML(album.artist)} · ${escapeHTML(album.title)}&lt;br&gt;${album.year} · ${track[1]}&lt;/p&gt;&lt;/div&gt;`;
      } else {
        const start=album.tracks.slice(0,index).reduce((sum,t)=&gt;sum+seconds(t[1]),0);
        const fields=[[&#x27;Title&#x27;,track[0]],[&#x27;Artist&#x27;,album.artist],[&#x27;Album&#x27;,album.title],[&#x27;Year&#x27;,album.year],[&#x27;Genre&#x27;,album.genre],[&#x27;Track&#x27;,`${index+1} / ${album.tracks.length}`],[&#x27;Format&#x27;,album.format===&#x27;OGG&#x27;?&#x27;Ogg Vorbis&#x27;:album.format===&#x27;OPUS&#x27;?&#x27;Ogg Opus&#x27;:`${album.format} · ${album.format===&#x27;FLAC&#x27;?&#x27;16-bit / 44.1 kHz&#x27;:&#x27;320 kbps&#x27;}`],[&#x27;File&#x27;,album.cue?&#x27;album.flac&#x27;:`${String(index+1).padStart(2,&#x27;0&#x27;)} ${track[0]}.${album.format===&#x27;FLAC&#x27;?&#x27;flac&#x27;:album.format===&#x27;MP3&#x27;?&#x27;mp3&#x27;:&#x27;ogg&#x27;}`],...(album.cue?[[&#x27;CUE sheet&#x27;,&#x27;album.cue&#x27;],[&#x27;Segment&#x27;,`${clock(start)} – ${clock(start+seconds(track[1]))}`]]:[])];
        detail=`&lt;dl class=&quot;tag-list&quot;&gt;${fields.map(([key,value])=&gt;`&lt;dt&gt;${key}&lt;/dt&gt;&lt;dd&gt;${escapeHTML(value)}&lt;/dd&gt;`).join(&#x27;&#x27;)}&lt;/dl&gt;&lt;div class=&quot;action-row&quot;&gt;&lt;button class=&quot;am-button&quot; data-action=&quot;metadata&quot;&gt;${icon(&#x27;square-pen&#x27;)} Edit Metadata&lt;/button&gt;&lt;button class=&quot;am-button&quot; data-action=&quot;artwork&quot;&gt;${icon(&#x27;image&#x27;)} Artwork&lt;/button&gt;&lt;/div&gt;`;
      }
      return `&lt;div class=&quot;context-kicker&quot;&gt;${samePlaying?&#x27;Now Playing&#x27;:&#x27;Selected Track&#x27;}&lt;/div&gt;&lt;div class=&quot;now-hero&quot;&gt;${cover(album,true)}&lt;div&gt;&lt;h1&gt;${escapeHTML(track[0])}&lt;/h1&gt;&lt;button class=&quot;artist-link&quot; data-action=&quot;artist&quot; data-value=&quot;${escapeHTML(album.artist)}&quot;&gt;${escapeHTML(album.artist)}&lt;/button&gt;&lt;p class=&quot;dim&quot;&gt;${escapeHTML(album.title)}&lt;/p&gt;&lt;p class=&quot;dim&quot;&gt;${album.year} · ${album.genre}&lt;/p&gt;&lt;span class=&quot;file-badge&quot;&gt;${album.cue?&#x27;CUE + FLAC&#x27;:album.format===&#x27;OGG&#x27;?&#x27;OGG VORBIS&#x27;:album.format===&#x27;OPUS&#x27;?&#x27;OGG OPUS&#x27;:album.format===&#x27;FLAC&#x27;?&#x27;FLAC · 16 / 44.1&#x27;:album.format}&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;nav class=&quot;context-tabs&quot; aria-label=&quot;Track context&quot;&gt;${[&#x27;Overview&#x27;,&#x27;Lyrics&#x27;,&#x27;Tags&#x27;].map(tab=&gt;`&lt;button data-action=&quot;context-tab&quot; data-value=&quot;${tab.toLowerCase()}&quot; aria-selected=&quot;${state.tab===tab.toLowerCase()}&quot;&gt;${tab}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/nav&gt;${detail}&lt;div class=&quot;context-footer&quot;&gt;&lt;span&gt;${icon(album.source===&#x27;local&#x27;?&#x27;hard-drive&#x27;:album.source===&#x27;subsonic&#x27;?&#x27;server&#x27;:&#x27;podcast&#x27;)}${escapeHTML(sourceNames[album.source])}&lt;/span&gt;&lt;button class=&quot;context-action&quot; data-action=&quot;album&quot; data-value=&quot;${album.id}&quot; style=&quot;margin:0&quot;&gt;View album ${icon(&#x27;arrow-right&#x27;)}&lt;/button&gt;&lt;/div&gt;`;
    }
    function context() {
      q(&#x27;.context-toolbar&#x27;).innerHTML=`&lt;h2&gt;${state.context===&#x27;home&#x27;?&#x27;Home&#x27;:state.context===&#x27;album&#x27;?&#x27;Album&#x27;:state.context===&#x27;artist&#x27;?&#x27;Artist&#x27;:&#x27;Listening Context&#x27;}&lt;/h2&gt;&lt;div class=&quot;queue-tools&quot;&gt;${state.context!==&#x27;home&#x27;?`&lt;button class=&quot;icon-button&quot; data-action=&quot;home&quot; aria-label=&quot;Go to home&quot; data-tooltip=&quot;Home&quot;&gt;${icon(&#x27;house&#x27;)}&lt;/button&gt;`:&#x27;&#x27;}&lt;button class=&quot;icon-button&quot; data-action=&quot;now-playing&quot; aria-label=&quot;Show current track&quot; data-tooltip=&quot;Show current track&quot;&gt;${icon(&#x27;audio-lines&#x27;)}&lt;/button&gt;&lt;button class=&quot;icon-button&quot; data-action=&quot;metadata&quot; aria-label=&quot;Edit metadata&quot; data-tooltip=&quot;Edit metadata&quot;&gt;${icon(&#x27;square-pen&#x27;)}&lt;/button&gt;&lt;/div&gt;`;
      const album=chosen();
      if(state.context===&#x27;home&#x27;) q(&#x27;.context-content&#x27;).innerHTML=home();
      else if(state.context===&#x27;album&#x27;) q(&#x27;.context-content&#x27;).innerHTML=albumView(album);
