<style>
#macarok-designs { width:100%; }

#macarok-designs .am-window {

  --am-toolbar:light-dark(#f3f4f5,#292b2e); --am-raised:light-dark(#ffffff,#323438);

  --am-positive:light-dark(#368250,#8fc29d); --am-soft:light-dark(#eef5fb,#273746);
  color:var(--am-ink); background:var(--am-bg); border:1px solid var(--am-line);

(() => {

    {id:'server-migration',artist:'Bonobo',title:'Migration',year:2017,art:'migration',format:'FLAC',source:'subsonic',genre:'Electronic',tracks:[['Migration','5:27'],['Break Apart','4:34'],['Outlier','7:55'],['Grains','4:28']]},

  const byID = id => albums.find(album => album.id === id) || albums[0];

  const cover = (album,large=false) => `<div class="cover${large?' large-cover':''}" data-art="${album.art}" role="img" aria-label="${escapeHTML(album.title)} artwork study"><span class="cover-lettering">${escapeHTML(album.artist)}<small>${escapeHTML(album.title)}</small></span></div>`;
  const makeEntry = (album,index) => ({albumID:album.id,index,source:album.source});
  const sourceNames = {local:'Local Files',subsonic:'Home · OpenSubsonic',podcasts:'Podcasts'};
  const biographies = {
    'Boards of Canada':'The Scottish duo of Michael Sandison and Marcus Eoin. Warm analogue textures, shifting rhythms, and melodies that feel half remembered.',
    'Radiohead':'The English band’s seventh studio album brings intricate rhythms, intimate arrangements, and a warmer, more immediate sound.',
    'Pink Floyd':'A continuous album in ten movements. The CUE sheet preserves the track boundaries within a single lossless audio file.',
    'Nils Frahm':'Piano, electronics, and the space between them. This collection draws on recordings made in concert over two years.'
  };
  const instances = [];
  function makePlayer(app,layout) {
    const catalog=albums.map(album=>({...album,tracks:album.tracks.map(track=>[...track])}));
    const byID=id=>catalog.find(album=>album.id===id)||catalog[0];
    const saved = window.openai?.widgetState?.privateContent?.[layout];
    const state = {source:'local',view:layout==='album'?'home':'artists',selected:'campfire',selectedTrack:3,context:layout==='album'?'home':'track',tab:'overview',playing:true,current:3,progress:154,query:'',top:'Albums',appearance:'system',buffer:'Automatic',bufferSeconds:20,doubleClick:'Add to active playlist',sheet:null,settingsTab:'General',status:'Library is up to date',artChoice:'embedded',folder:'Electronic',queue:byID('campfire').tracks.slice(0,10).map((_,index)=>makeEntry(byID('campfire'),index)),...saved};
    state.source = sourceNames[state.source] ? state.source : 'local';
    state.repeat = ['none','playlist','track'].includes(state.repeat) ? state.repeat : 'none';
    state.queue = Array.isArray(state.queue) && state.queue.length ? state.queue.filter(entry=>byID(entry.albumID).tracks[entry.index]) : byID('campfire').tracks.slice(0,10).map((_,index)=>makeEntry(byID('campfire'),index));

    const currentAlbum = () => currentEntry() ? byID(currentEntry().albumID) : chosen();
    const currentTrack = () => currentEntry() ? currentAlbum().tracks[currentEntry().index] : chosen().tracks[0];
    const viewLabels = ['Home','Artists','Albums','Years','Folders','Tags'];
    app.innerHTML = `<div class="am-titlebar"><div class="traffic" aria-hidden="true"><span></span><span></span><span></span></div><span class="app-name">Macarok</span><span class="window-subtitle">Your music. In good company.</span></div>
      <div class="am-transport"></div>
      <div class="am-main">
        <aside class="library-pane" aria-label="Music library"><label class="source-select">${icon('hard-drive')}<select data-field="source" aria-label="Library source"><option value="local">Local Files</option><option value="subsonic">Home · OpenSubsonic</option><option value="podcasts">Podcasts</option></select></label><label class="library-search">${icon('search')}<input type="search" data-field="search" aria-label="Search selected source" placeholder="Search this library"><span class="small dim">⌘F</span></label><nav class="view-switch" aria-label="Library views"></nav><div class="library-caption"><span class="library-heading"></span><button class="icon-button" data-action="shuffle-library" aria-label="Shuffle this library" data-tooltip="Shuffle this library">${icon('shuffle')}</button></div><div class="library-list"></div><div class="library-bottom"></div></aside>

        rows=items.map(album=>listRow(album.title,'album',album.id,{album,selected:album.id===state.selected})).join('');
      } else if(state.view==='years') {
        [...new Set(items.map(album=>album.year))].sort((a,b)=>b-a).forEach(year=>{

        });
      } else if(state.view==='folders') {
        rows+=listRow(state.source==='local'?'Music':state.source==='subsonic'?'Music library':'Downloaded episodes','folder','root',{symbol:'folder-open',count:items.length});
        const groups=state.source==='local'?['Electronic','Alternative','Progressive Rock','Modern Classical','Trip Hop']:[...new Set(items.map(album=>album.genre))];
        groups.forEach(genre=>{
          const matching=items.filter(album=>album.genre===genre);
          rows+=listRow(genre,'folder',genre,{depth:'child',symbol:genre===state.folder?'folder-open':'folder',selected:genre===state.folder,count:matching.length});
          if(genre===state.folder) matching.forEach(album=>{rows+=listRow(album.title,'album',album.id,{depth:'deep',symbol:'disc-3',count:album.cue?'CUE':''});});

      } else if(state.view==='tags') {
        rows+=listRow('Genre','tag-group','genre',{symbol:'chevron-down'});
        [...new Set(items.map(album=>album.genre))].forEach(genre=>{rows+=listRow(genre,'genre',genre,{depth:'child',symbol:'tag',selected:selected.genre===genre,count:items.filter(album=>album.genre===genre).length});});
        rows+=listRow('File format','tag-group','format',{symbol:'chevron-down'});
        [...new Set(items.map(album=>album.format))].forEach(format=>{rows+=listRow(format==='OGG'?'Ogg Vorbis':format==='OPUS'?'Ogg Opus':format,'format',format,{depth:'child',symbol:'file-audio',count:items.filter(album=>album.format===format).length});});
      }
      q('.library-list').innerHTML=rows;
      const total=items.reduce((sum,album)=>sum+album.tracks.length,0);
      q('.library-bottom').innerHTML=`<p>${items.length} ${state.source==='podcasts'?'shows':'albums'} · ${total} ${state.source==='podcasts'?'episodes':'tracks'}</p><button class="library-shortcut" data-action="${state.source==='subsonic'?'source-settings':'refresh'}">${icon(state.source==='subsonic'?'shield-check':'refresh-cw')}<span>${state.source==='subsonic'?'HTTPS · Trusted certificate':state.source==='podcasts'?'Refresh feeds':'Scan for changes'}</span></button>`;
    }
    function tile(album) {return `<button class="album-tile" data-action="album" data-value="${album.id}">${cover(album,true)}<strong class="ellipsis" data-tooltip="${escapeHTML(album.title)}">${escapeHTML(album.title)}</strong><span class="dim ellipsis">${escapeHTML(album.artist)}</span></button>`;}

    function trackView(album) {

      }
      return `<div class="context-kicker">${samePlaying?'Now Playing':'Selected Track'}</div><div class="now-hero">${cover(album,true)}<div><h1>${escapeHTML(track[0])}</h1><button class="artist-link" data-action="artist" data-value="${escapeHTML(album.artist)}">${escapeHTML(album.artist)}</button><p class="dim">${escapeHTML(album.title)}</p><p class="dim">${album.year} · ${album.genre}</p><span class="file-badge">${album.cue?'CUE + FLAC':album.format==='OGG'?'OGG VORBIS':album.format==='OPUS'?'OGG OPUS':album.format==='FLAC'?'FLAC · 16 / 44.1':album.format}</span></div></div><nav class="context-tabs" aria-label="Track context">${['Overview','Lyrics','Tags'].map(tab=>`<button data-action="context-tab" data-value="${tab.toLowerCase()}" aria-selected="${state.tab===tab.toLowerCase()}">${tab}</button>`).join('')}</nav>${detail}<div class="context-footer"><span>${icon(album.source==='local'?'hard-drive':album.source==='subsonic'?'server':'podcast')}${escapeHTML(sourceNames[album.source])}</span><button class="context-action" data-action="album" data-value="${album.id}" style="margin:0">View album ${icon('arrow-right')}</button></div>`;
    }
    function context() {
      q('.context-toolbar').innerHTML=`<h2>${state.context==='home'?'Home':state.context==='album'?'Album':state.context==='artist'?'Artist':'Listening Context'}</h2><div class="queue-tools">${state.context!=='home'?`<button class="icon-button" data-action="home" aria-label="Go to home" data-tooltip="Home">${icon('house')}</button>`:''}<button class="icon-button" data-action="now-playing" aria-label="Show current track" data-tooltip="Show current track">${icon('audio-lines')}</button><button class="icon-button" data-action="metadata" aria-label="Edit metadata" data-tooltip="Edit metadata">${icon('square-pen')}</button></div>`;

        q('.context-content').innerHTML=`<div class="context-kicker">Artist</div><h1>${escapeHTML(album.artist)}</h1><p class="dim small" style="margin-top:6px">${artistAlbums.length} albums · ${artistAlbums.reduce((sum,a)=>sum+a.tracks.length,0)} tracks in this source</p><div class="action-row"><button class="am-button primary" data-action="shuffle-artist">${icon('shuffle')} Shuffle Artist</button><button class="am-button" data-action="add-artist">${icon('list-plus')} Add to Playlist</button></div><p class="context-body-copy">${escapeHTML(biographies[album.artist]||`Browse ${album.artist} in your collection.`)}</p><section class="context-section"><h3>Albums</h3>${artistAlbums.map(other=>`<button class="recent-track" data-action="album" data-value="${other.id}">${cover(other)}<span><strong>${escapeHTML(other.title)}</strong><span class="dim">${other.year} · ${other.tracks.length} tracks</span></span>${icon('chevron-right')}</button>`).join('')}</section>`;
      } else q('.context-content').innerHTML=trackView(album);

    function queue() {
      const repeatLabel={none:'None',playlist:'Playlist',track:'Track'};
      const nextRepeat={none:'playlist',playlist:'track',track:'none'};
      const repeatButton=q('[data-action="repeat"]');
      repeatButton.setAttribute('aria-pressed',String(state.repeat!=='none'));
      repeatButton.setAttribute('aria-label',`Repeat mode: ${repeatLabel[state.repeat]}`);
      repeatButton.dataset.tooltip=`Repeat: ${repeatLabel[state.repeat]} · Next: ${repeatLabel[nextRepeat[state.repeat]]}`;
      repeatButton.innerHTML=icon(state.repeat==='track'?'repeat-1':'repeat');
      q('.queue-count').textContent=`· ${state.queue.length}`;
      const album=currentAlbum();
      q('.queue-album-heading').innerHTML=`${cover(album)}<div style="min-width:0"><strong class="ellipsis">${escapeHTML(album.title)}</strong><span class="dim ellipsis">${escapeHTML(album.artist)}</span></div>`;
      const offset=state.queueOffset||0;
      q('.queue-list').innerHTML=state.queue.slice(offset,offset+12).map((entry,localIndex)=>{
        const index=localIndex+offset;

      }).join('')+(state.queue.length>12?`<button class="library-shortcut" data-action="queue-more" style="padding:10px 15px">${icon('list-music')} ${offset+12<state.queue.length?`${state.queue.length-offset-12} more tracks`:'Back to the beginning'}</button>`:'');
    }
    function status(message) {

      const total=state.queue.reduce((sum,entry)=>sum+seconds(byID(entry.albumID).tracks[entry.index][1]),0);

    function generalSettings() {return `<h3>Appearance & behavior</h3><div class="settings-group"><label class="setting-row"><span>Appearance<small>Match your Mac or choose an appearance.</small></span><select data-field="appearance">${['System','Light','Dark'].map(value=>`<option value="${value.toLowerCase()}" ${state.appearance===value.toLowerCase()?'selected':''}>${value}</option>`).join('')}</select></label><label class="setting-row"><span>Double-click in library</span><select data-field="doubleClick"><option ${state.doubleClick==='Add to active playlist'?'selected':''}>Add to active playlist</option><option ${state.doubleClick==='Play now'?'selected':''}>Play now</option></select></label></div>`;}
    function playbackSettings() {return `<h3>Streaming</h3><div class="settings-group"><label class="setting-row"><span>Streaming buffer<small>Keep more audio ready before playback.</small></span><select data-field="buffer"><option ${state.buffer==='Automatic'?'selected':''}>Automatic</option><option ${state.buffer==='Custom'?'selected':''}>Custom</option></select></label>${state.buffer==='Custom'?`<label class="setting-row"><span>Target buffer duration</span><span><input type="number" min="1" max="120" value="${state.bufferSeconds}" data-field="bufferSeconds" aria-label="Buffer duration in seconds" style="width:65px"> seconds</span></label>`:''}<div class="setting-row"><span>Streaming quality</span><span class="dim">Original</span></div></div><p class="sheet-note">Original quality is used whenever the source provides it.</p>`;}

    function sourceSettings() {return `<h3>Home · OpenSubsonic</h3><div class="settings-group"><div class="setting-row"><span>Server URL</span><span class="dim">https://music.home:4533</span></div><div class="setting-row"><span>Connection</span><span style="color:var(--am-positive)">${icon('shield-check')} Connected</span></div><div class="setting-row"><span>Certificate<small>Self-signed · accepted for this server.</small></span><button class="am-button" data-action="certificate">View Certificate</button></div></div><p class="sheet-note">HTTP and HTTPS servers are supported. Certificate trust is saved separately for each server.</p>`;}
    function sheet() {

      }
      slot.innerHTML=`<div class="am-sheet-backdrop"><section class="am-sheet" role="dialog" aria-modal="true" aria-label="${title}"><header class="sheet-header"><h2>${title}</h2><button class="icon-button" data-action="close-sheet" aria-label="Close dialog">${icon('x')}</button></header>${body}<footer class="sheet-footer">${footer}</footer></section></div>`;

    function render() {
      app.dataset.appearance=state.appearance;

    function update(message) {if(message)state.status=message;render();persist();}
    function append(entries) {
      const count=entries.length;

    }
    function shuffled(entries) {const copy=[...entries];for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]];}return copy;}
    function groupEntries(items) {return items.flatMap(album=>album.tracks.map((_,index)=>makeEntry(album,index)));}
    function startQueue(index) {
      state.current=index;state.queueOffset=Math.floor(index/12)*12;state.playing=true;state.progress=0;
      const entry=currentEntry();state.selected=entry.albumID;state.selectedTrack=entry.index;state.context='track';

    app.addEventListener('click',event=>{
      const button=event.target.closest('button[data-action]');if(!button)return;
      const action=button.dataset.action,value=button.dataset.value;
      if(action==='queue-track') {status('Double-click a playlist track to play it');icons();return;}
      if(action==='play') {state.playing=!state.playing;update(state.playing?'Playback resumed':'Playback paused');}
      else if(action==='next')startQueue((state.current+1)%state.queue.length);
      else if(action==='previous')startQueue((state.current-1+state.queue.length)%state.queue.length);
      else if(action==='appearance'){state.appearance=state.appearance==='system'?'light':state.appearance==='light'?'dark':'system';update();}
      else if(action==='settings'||action==='source-settings'){state.sheet='settings';if(action==='source-settings')state.settingsTab='Sources';render();q('.am-sheet button')?.focus();}
      else if(action==='close-sheet'){state.sheet=null;render();q('[data-action="settings"]')?.focus();}
      else if(action==='settings-tab'){state.settingsTab=value;sheet();icons();}
      else if(action==='context-tab'){state.tab=value;context();icons();persist();}
      else if(action==='certificate'){state.sheet='certificate';sheet();icons();}
      else if(action==='view'){state.view=value;state.query='';q('[data-field="search"]').value='';state.context=value==='home'?'home':value==='artists'?'artist':'album';update();}
      else if(action==='home'){state.view='home';state.context='home';update();}
      else if(action==='album'){state.selected=value;state.selectedTrack=0;state.context='album';if(chosen().source!==state.source)state.source=chosen().source;scheduleSelection();}
      else if(action==='select-track'){
        const [id,index]=value.split(':');state.selected=id;state.selectedTrack=Number(index);
        state.context='track';
        scheduleSelection();
      }
      else if(action==='artist'){const album=ownAlbums().find(other=>other.artist===value);if(album)state.selected=album.id;state.view='artists';state.context='artist';update();}
      else if(action==='year'){const album=ownAlbums().find(other=>other.year===Number(value));if(album)state.selected=album.id;state.context='album';update();}
      else if(action==='genre'||action==='format'){const album=ownAlbums().find(other=>other[action]===value);if(album){state.selected=album.id;state.selectedTrack=0;}state.context='album';update();}
      else if(action==='folder'){state.folder=value==='root'?ownAlbums()[0].genre:value;const album=ownAlbums().find(other=>other.genre===state.folder);if(album)state.selected=album.id;state.context='album';update();}
      else if(action==='tag-group'){update(value==='format'?'Browse tracks by file format':'Browse tracks by genre');}
      else if(action==='now-playing'){const entry=currentEntry();state.selected=entry.albumID;state.selectedTrack=entry.index;state.context='track';update();}
      else if(action==='add-album'){append(groupEntries([chosen()]));}
      else if(action==='add-artist'){append(groupEntries(ownAlbums().filter(album=>album.artist===chosen().artist)));}
      else if(['shuffle-library','shuffle-album','shuffle-artist','shuffle-folder'].includes(action)){
        const items=action==='shuffle-library'?ownAlbums():action==='shuffle-folder'?ownAlbums().filter(album=>album.genre===state.folder):action==='shuffle-artist'?ownAlbums().filter(album=>album.artist===chosen().artist):[chosen()];
        state.queue=shuffled(groupEntries(items));state.current=0;state.queueOffset=0;startQueue(0);
      }
      else if(action==='shuffle-queue'){const current=currentEntry();state.queue=[current,...shuffled(state.queue.filter((_,index)=>index!==state.current))];state.current=0;update('Playlist shuffled');}
      else if(action==='repeat'){
        state.repeat={none:'playlist',playlist:'track',track:'none'}[state.repeat];
        queue();status({none:'Repeat off',playlist:'Repeat playlist',track:'Repeat current track'}[state.repeat]);icons();persist();
      }
      else if(action==='metadata'||action==='artwork'){state.sheet=action;render();q('.am-sheet input, .am-sheet button')?.focus();}
      else if(action==='save-metadata'){
        const album=chosen(),track=album.tracks[state.selectedTrack]||album.tracks[0];
        track[0]=q('[data-edit="title"]').value||track[0];album.artist=q('[data-edit="artist"]').value||album.artist;album.title=q('[data-edit="album"]').value||album.title;album.year=Number(q('[data-edit="year"]').value)||album.year;
        state.sheet=null;update(`Metadata changes previewed for “${track[0]}”`);
      }
      else if(action==='art-choice'){state.artChoice=value;sheet();icons();}
      else if(action==='save-artwork'){state.sheet=null;update('Artwork selection saved in this preview');}
      else if(action==='find-lyrics'){status('No lyrics found for this recording');icons();}
      else if(action==='refresh'){status(state.source==='podcasts'?'Podcast feeds are up to date':'Library scan complete · no new files');icons();}
      else if(action==='save-playlist'){state.sheet='playlist';render();}
      else if(action==='save-playlist-confirm'){state.sheet=null;update('Playlist saved in this preview');}
      else if(action==='queue-more'){state.queueOffset=(state.queueOffset||0)+12<state.queue.length?(state.queueOffset||0)+12:0;update('Showing more playlist tracks');}
      else if(action==='record-shortcut'){
        button.textContent='Press keys…';button.dataset.recording='true';
        const record=keyEvent=>{keyEvent.preventDefault();keyEvent.stopPropagation();if(['Meta','Control','Alt','Shift'].includes(keyEvent.key))return;if(keyEvent.key==='Escape'){button.textContent='Record…';}else{const key=[keyEvent.metaKey?'⌘':'',keyEvent.ctrlKey?'⌃':'',keyEvent.altKey?'⌥':'',keyEvent.shiftKey?'⇧':'',keyEvent.key===' '?'Space':keyEvent.key.length===1?keyEvent.key.toUpperCase():keyEvent.key].join(' ');button.textContent=key;}delete button.dataset.recording;app.removeEventListener('keydown',record,true);};
        app.addEventListener('keydown',record,true);button.focus();
      }
    });
    app.addEventListener('dblclick',event=>{
      const button=event.target.closest('button[data-action]');if(!button)return;
      clearTimeout(selectionTimer);
      if(button.dataset.action==='queue-track'){startQueue(Number(button.dataset.value));return;}
      if(button.dataset.action==='select-track'){
        const[id,index]=button.dataset.value.split(':'),entry=makeEntry(byID(id),Number(index));
        state.queue.push(entry);
        if(state.doubleClick==='Play now'){startQueue(state.queue.length-1);}else update(`Added “${byID(id).tracks[Number(index)][0]}” to the active playlist`);
      }else if(button.dataset.action==='album')append(groupEntries([byID(button.dataset.value)]));
    });
    app.addEventListener('input',event=>{
      const field=event.target.dataset.field;
      if(field==='search'){state.query=event.target.value;library();icons();}
      if(field==='seek'){state.progress=Number(event.target.value);q('.elapsed').textContent=clock(state.progress);}
    });
    app.addEventListener('change',event=>{
      const field=event.target.dataset.field,value=event.target.value;
      if(field==='source'){state.source=value;state.selected=ownAlbums()[0].id;state.selectedTrack=0;state.query='';q('[data-field="search"]').value='';state.context=state.view==='home'?'home':'album';state.folder=ownAlbums()[0].genre;update(`Browsing ${sourceNames[state.source]}`);}
      else if(field==='top'){state.top=value;context();icons();persist();}
      else if(['appearance','buffer','doubleClick'].includes(field)){state[field]=value;render();persist();}
      else if(field==='bufferSeconds'){state.bufferSeconds=Math.max(1,Math.min(120,Number(value)||20));event.target.value=state.bufferSeconds;persist();}
    });
    app.addEventListener('keydown',event=>{
      if(event.key==='Escape'&&state.sheet){state.sheet=null;render();return;}
      if(event.key==='Tab'&&state.sheet){const focusable=[...q('.am-sheet').querySelectorAll('button,input,select')].filter(element=>!element.disabled);const first=focusable[0],last=focusable[focusable.length-1];if(event.shiftKey&&document.activeElement===first){last.focus();event.preventDefault();}else if(!event.shiftKey&&document.activeElement===last){first.focus();event.preventDefault();}return;}
      if(state.sheet)return;
      if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='f'){event.preventDefault();q('[data-field="search"]').focus();return;}
      if(/INPUT|SELECT|TEXTAREA/.test(event.target.tagName))return;
      if(event.code==='Space'){event.preventDefault();state.playing=!state.playing;update(state.playing?'Playback resumed':'Playback paused');}
    });
    render();
    const design={libraryWidth:layout==='album'?24:28,density:'Compact'};
    if(globalThis.Tweak){const tweak=new Tweak({container:app,onChange:()=>{app.style.setProperty('--library-size',`${design.libraryWidth}%`);app.dataset.appearance=state.appearance;persist();}});tweak.addSlider(design,'libraryWidth',{label:'Library panel width',min:22,max:35,step:1,unit:'%'});tweak.addSelect(state,'appearance',{label:'Appearance',options:[{label:'System',value:'system'},{label:'Light',value:'light'},{label:'Dark',value:'dark'}]});}
    instances.push({app,state,render});
  }
  makePlayer(document.getElementById('macarok-collection'),'collection');
  makePlayer(document.getElementById('macarok-albums'),'album');
  window.addEventListener('openai:set_globals',event=>{
    const saved=event.detail?.globals?.widgetState?.privateContent;
    if(!saved)return;
    instances.forEach(instance=>{const data=saved[instance.app.dataset.layout];if(data?.appearance){instance.state.appearance=data.appearance;instance.app.dataset.appearance=data.appearance;}});
  });
})();
</script>
